              </details>
              <div class="btn-row">
                <button class="btn btn-secondary" onclick="document.querySelector('.modal-overlay').remove();currentModal=null;">取消</button>
                <button class="btn btn-primary" id="btnSaveSettings">保存设置</button>
              </div>
            </div>
          `;
            document.body.appendChild(overlay);

            // 切换API提供商时显示/隐藏字段
            overlay.querySelector('#setApiProvider').addEventListener('change', function() {
                const isOllama = this.value === 'ollama';
                overlay.querySelector('#groupOllamaUrl').style.display = isOllama ? 'block' : 'none';
                overlay.querySelector('#groupOllamaModel').style.display = isOllama ? 'block' : 'none';
                overlay.querySelector('#groupApiBase').style.display = isOllama ? 'none' : 'block';
                overlay.querySelector('#groupModel').style.display = isOllama ? 'none' : 'block';
            });

            overlay.querySelector('#btnSaveSettings').addEventListener('click', () => {
                const newSettings = {
                    apiProvider: overlay.querySelector('#setApiProvider').value,
                    apiKey: overlay.querySelector('#setApiKey').value,
                    apiBase: overlay.querySelector('#setApiBase').value,
                    model: overlay.querySelector('#setModel').value,
                    ollamaUrl: overlay.querySelector('#setOllamaUrl').value,
                    ollamaModel: overlay.querySelector('#setOllamaModel').value,
                    temperature: parseFloat(overlay.querySelector('#setTemperature').value),
                    maxTokens: parseInt(overlay.querySelector('#setMaxTokens').value),
                    imageGenApi: overlay.querySelector('#setImageGenApi').value,
                    imageGenModel: overlay.querySelector('#setImageGenModel').value,
                    videoGenApi: overlay.querySelector('#setVideoGenApi').value,
                };
                state.updateSettings(newSettings);
                overlay.remove();
                currentModal = null;
                render();
                showToast('设置已保存 ✅');
            });
        }

        function openTemplatesModal() {
            currentModal = 'templates';
            const templates = state.data.promptTemplates;
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
            <div class="modal" style="max-width:650px;">
              <h3>📋 提示词模板管理</h3>
              <div id="templatesList" style="max-height:350px;overflow-y:auto;margin-bottom:12px;">
                ${templates.map(t => `
                  <div style="display:flex;align-items:center;gap:8px;padding:10px;border-radius:var(--radius-sm);background:var(--bg-tertiary);margin-bottom:6px;">
                    <span style="flex:1;font-size:0.85rem;font-weight:500;">${escapeHtml(t.title)}</span>
                    <span style="font-size:0.7rem;color:var(--text-tertiary);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(t.content)}</span>
                    <button class="btn-icon-sm danger" data-del-tpl="${t.id}" style="flex-shrink:0;">🗑</button>
                  </div>
                `).join('')}
              </div>
              <div class="form-group">
                <label>模板标题</label>
                <input type="text" id="tplTitle" placeholder="给模板起个名字">
              </div>
              <div class="form-group">
                <label>模板内容</label>
                <textarea id="tplContent" rows="2" placeholder="提示词内容..."></textarea>
              </div>
              <div class="btn-row">
                <button class="btn btn-secondary" onclick="document.querySelector('.modal-overlay').remove();currentModal=null;">关闭</button>
                <button class="btn btn-primary" id="btnAddTpl">添加模板</button>
              </div>
            </div>
          `;
            document.body.appendChild(overlay);

            overlay.querySelector('#btnAddTpl').addEventListener('click', () => {
                const title = overlay.querySelector('#tplTitle').value.trim();
                const content = overlay.querySelector('#tplContent').value.trim();
                if (!title || !content) {
                    showToast('请填写模板标题和内容');
                    return;
                }
                state.addPromptTemplate(title, content);
                overlay.remove();
                currentModal = null;
                openTemplatesModal();
                showToast('模板已添加');
            });

            overlay.querySelector('#templatesList').addEventListener('click', (e) => {
                const delBtn = e.target.closest('[data-del-tpl]');
                if (delBtn) {
                    state.deletePromptTemplate(delBtn.dataset.delTpl);
                    overlay.remove();
                    currentModal = null;
                    openTemplatesModal();
                    showToast('模板已删除');
                }
            });
        }

        function openTemplatesQuickModal() {
            const templates = state.data.promptTemplates;
            if (templates.length === 0) {
                showToast('暂无提示词模板，请在设置中创建');
                return;
            }
            currentModal = 'templatesQuick';
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
            <div class="modal" style="max-width:500px;">
              <h3>📋 选择提示词模板</h3>
              <div style="display:flex;flex-direction:column;gap:6px;">
                ${templates.map(t => `
                  <div class="tpl-chip" data-content="${escapeHtml(t.content)}" style="padding:12px;border-radius:var(--radius-sm);background:var(--bg-tertiary);cursor:pointer;transition:all var(--transition);border:1px solid transparent;">
                    <strong style="font-size:0.85rem;">${escapeHtml(t.title)}</strong>
                    <p style="font-size:0.75rem;color:var(--text-tertiary);margin-top:2px;">${escapeHtml(t.content.substring(0,60))}...</p>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
            document.body.appendChild(overlay);

            overlay.querySelectorAll('.tpl-chip').forEach(chip => {
                chip.addEventListener('mouseenter', () => chip.style.borderColor =
                    'var(--accent)');
                chip.addEventListener('mouseleave', () => chip.style.borderColor =
                    'transparent');
                chip.addEventListener('click', () => {
                    const content = chip.dataset.content;
                    const input = document.getElementById('messageInput');
                    if (input) {
                        input.value = content;
                        input.dispatchEvent(new Event('input'));
                        input.focus();
                    }
                    overlay.remove();
                    currentModal = null;
                    showToast('模板已加载到输入框');
                });
            });
        }

        function closeModal() {
            if (currentModal) {
                const overlay = document.querySelector('.modal-overlay');
                if (overlay) overlay.remove();
                currentModal = null;
            }
        }

        // ==================== INIT ====================
        function init() {
            window._sidebarCollapsed = window.innerWidth < 768;
            render();
            document.getElementById('messageInput')?.focus();

            // 键盘快捷键
            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 'n') {
                    e.preventDefault();
                    state.createConversation();
                    attachedFiles = [];
                    render();
                    document.getElementById('messageInput')?.focus();
                }
                if (e.ctrlKey && e.key === 's') {
                    e.preventDefault();
                    showToast('数据已自动保存 💾');
                }
            });
        }

        // 启动应用
        init();

        console.log('✨ AI Assistant v' + APP_VERSION + ' 已就绪');
        console.log('💡 提示: Ctrl+N 新建对话 | Ctrl+Enter 换行 | Enter 发送');
        console.log('📁 支持粘贴图片 | 左侧设置可配置API');
        console.log('🌐 支持: OpenAI | Claude | Ollama | 自定义API');
    </script>
</body>
</html>
